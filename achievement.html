<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملف التحصيل الدراسي | معلّمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dceae7;--ink:#123331;--muted:#66807c;--brand:#0c655b;--brand2:#073e39;--gold:#b38b2a;--line:rgba(255,255,255,.72);--glass:rgba(255,255,255,.58);--glass2:rgba(247,252,250,.78);--shadow:0 22px 65px rgba(15,61,57,.13)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tajawal,Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 7% 7%,rgba(30,128,115,.22),transparent 25%),radial-gradient(circle at 93% 12%,rgba(218,178,74,.20),transparent 22%),linear-gradient(145deg,#d5e5e2,#edf4f2 48%,#d9e8e5);min-height:100vh}.hidden{display:none!important}button,input{font:inherit}.glass{background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(240,248,246,.48));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%)}.lookup{min-height:100vh;display:grid;place-items:center;padding:24px}.lookup-card{width:min(620px,100%);padding:35px;border-radius:30px;text-align:center}.mark{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;margin:auto;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff;font-weight:900;font-size:30px;box-shadow:0 12px 28px rgba(12,101,91,.22)}h1{margin:15px 0 7px}.lookup p{color:var(--muted);line-height:1.8}.lookup-form{display:flex;gap:9px;margin-top:22px}.lookup-form input{flex:1;min-width:0;border:1px solid rgba(85,130,123,.23);background:rgba(255,255,255,.65);border-radius:15px;padding:14px 16px;outline:none;text-transform:uppercase}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:900;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 8px 20px rgba(21,63,59,.08)}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}.error{margin-top:13px;color:#a6312a;font-weight:800}.shell{display:grid;grid-template-columns:285px 1fr;min-height:100vh;padding:18px;gap:18px}.sidebar{position:sticky;top:18px;height:calc(100vh - 36px);border-radius:27px;padding:19px;overflow:auto}.brandline{display:flex;align-items:center;gap:11px;padding-bottom:16px;border-bottom:1px solid rgba(74,119,112,.14)}.brandline .mark{width:45px;height:45px;border-radius:15px;margin:0;font-size:21px}.brandline b{font-size:19px}.brandline small{display:block;color:var(--muted)}.nav{display:grid;gap:7px;margin-top:17px}.nav a{text-decoration:none;color:#57736f;padding:10px 11px;border-radius:12px;font-weight:800;font-size:13px}.nav a:hover{background:rgba(228,242,238,.75);color:var(--brand)}.side-meta{margin-top:18px;padding:12px;border-radius:14px;background:rgba(238,247,244,.7);color:var(--muted);font-size:12px;line-height:1.8}.main{min-width:0}.cover{min-height:460px;border-radius:32px;padding:42px;position:relative;overflow:hidden;display:flex;align-items:flex-end;margin-bottom:18px;background:linear-gradient(135deg,rgba(4,65,59,.92),rgba(12,101,91,.82) 56%,rgba(174,134,38,.78));color:#fff;box-shadow:0 30px 80px rgba(12,67,61,.19)}.cover:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;top:-190px;left:-120px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07)}.cover:after{content:"تحصيل";position:absolute;left:35px;bottom:-48px;font-size:145px;font-weight:900;color:rgba(255,255,255,.055)}.cover-content{position:relative;z-index:1;max-width:820px}.eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-weight:800;font-size:12px}.cover h1{font-size:44px;line-height:1.25;margin:17px 0 8px}.cover h2{font-size:25px;margin:0 0 13px;color:#f4d985}.cover p{max-width:680px;color:#d6e8e4;line-height:1.9}.cover-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.cover-meta span{padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.1);font-size:12px}.section{border-radius:28px;padding:25px;margin-bottom:18px;scroll-margin-top:18px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.section-head h2{margin:0;font-size:27px}.section-head p{margin:5px 0 0;color:var(--muted);line-height:1.7}.section-no{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:rgba(226,241,237,.75);color:var(--brand);font-weight:900}.blocks{display:grid;gap:14px}.block{border-radius:20px;padding:18px;background:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.82);box-shadow:inset 0 1px 0 #fff}.block h3{margin:0 0 11px;font-size:18px}.body{color:#496662;line-height:1.9}.fields,.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field,.metric{padding:13px;border-radius:14px;background:rgba(233,245,242,.72);border:1px solid rgba(255,255,255,.85)}.field span,.metric span{display:block;color:var(--muted);font-size:11px}.field b,.metric b{display:block;margin-top:3px}.metric b{font-size:29px;color:var(--brand2)}.table-wrap{overflow:auto;border-radius:15px;border:1px solid rgba(87,128,122,.16)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 12px;border-bottom:1px solid rgba(95,132,126,.13);text-align:right;font-size:13px}th{background:rgba(225,239,235,.76);color:#5c746f}td{background:rgba(255,255,255,.32)}tr:last-child td{border-bottom:0}.items{display:grid;gap:8px}.item{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:rgba(239,247,245,.72)}.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:8px;flex:0 0 auto}.process{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}.step{padding:14px;border-radius:14px;background:rgba(233,245,242,.7)}.step b{display:block;color:var(--brand);margin-bottom:5px}.note{margin-top:10px;padding:11px 13px;border-radius:13px;background:#fff7df;color:#785c16;font-size:12px;font-weight:700}.updated{text-align:center;color:var(--muted);font-size:12px;padding:15px}.top-actions{position:fixed;left:24px;bottom:24px;z-index:20;display:flex;gap:8px}.top-actions .btn{background:rgba(255,255,255,.78);backdrop-filter:blur(14px)}@media(max-width:900px){.shell{display:block;padding:10px}.sidebar{position:relative;top:0;height:auto;margin-bottom:10px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.cover{min-height:390px;padding:28px}.cover h1{font-size:34px}.section{padding:18px}.fields,.metrics{grid-template-columns:1fr 1fr}}@media(max-width:560px){.lookup-form{display:grid}.cover{min-height:350px;border-radius:24px}.cover h1{font-size:29px}.cover h2{font-size:20px}.fields,.metrics{grid-template-columns:1fr}.section-head h2{font-size:22px}.top-actions{left:12px;bottom:12px}}
@media print{body{background:#fff}.sidebar,.top-actions{display:none}.shell{display:block;padding:0}.cover,.section{box-shadow:none;break-inside:avoid}.glass{background:#fff;border:1px solid #ddd;box-shadow:none;backdrop-filter:none}}
</style></head><body>
<section id="lookup" class="lookup"><div class="lookup-card glass"><div class="mark">ض</div><h1>ملف التحصيل الدراسي</h1><p>أدخل رمز الملف الذي أرسلته المدرسة لعرض النسخة الحيّة المحدثة.</p><form id="lookupForm" class="lookup-form"><input id="codeInput" required placeholder="رمز الملف"><button class="btn primary">فتح الملف</button></form><div id="lookupError" class="error hidden"></div></div></section>
<section id="viewer" class="hidden"><div class="shell"><aside class="sidebar glass"><div class="brandline"><div class="mark">ض</div><div><b>معلّمي</b><small>ملف التحصيل الحي</small></div></div><nav id="nav" class="nav"></nav><div id="sideMeta" class="side-meta"></div></aside><main class="main"><section id="cover" class="cover"></section><div id="sections"></div><div id="updated" class="updated"></div></main></div><div class="top-actions"><button class="btn" onclick="window.print()">طباعة / PDF</button><button class="btn" onclick="navigator.share?.({title:document.title,url:location.href})||navigator.clipboard?.writeText(location.href)">مشاركة</button></div></section>
<script>
const API='https://udznpifopbnrcgxtpzza.supabase.co/functions/v1/achievement-public';const KEY='sb_publishable_UIuOZaeLk3oz25yf1kd-PA_OF8vEu8N';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function renderTable(c){const h=c.headers||[],r=c.rows||[];return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(x=>`<td>${esc(x||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}`}
function blockHtml(b){const c=b.content||{};let x='';if(c.body)x+=`<div class="body">${esc(c.body)}</div>`;if(Array.isArray(c.fields))x+=`<div class="fields" style="margin-top:10px">${c.fields.map(f=>`<div class="field"><span>${esc(f.label)}</span><b>${esc(f.value||'—')}</b></div>`).join('')}</div>`;if(Array.isArray(c.metrics))x+=`<div class="metrics">${c.metrics.map(m=>`<div class="metric"><span>${esc(m.label)}</span><b>${esc(m.value||'—')}${esc(m.unit||'')}</b></div>`).join('')}</div>`;if(Array.isArray(c.items))x+=`<div class="items">${c.items.map(i=>`<div class="item"><i class="dot"></i><span>${esc(i)}</span></div>`).join('')}</div>`;if(Array.isArray(c.steps))x+=`<div class="process">${c.steps.map(s=>`<div class="step"><b>${esc(s.title)}</b><span>${esc(s.text)}</span></div>`).join('')}</div>`;if(Array.isArray(c.headers)&&Array.isArray(c.rows))x+=renderTable(c);if(c.note&&!Array.isArray(c.rows))x+=`<div class="note">${esc(c.note)}</div>`;return `<article class="block"><h3>${esc(b.title||'')}</h3>${x||'<div class="body">لا توجد بيانات بعد.</div>'}</article>`}
function render(data){const b=data.book,s=data.sections||[];document.title=`${b.title} | ${b.school_name}`;document.getElementById('cover').innerHTML=`<div class="cover-content"><span class="eyebrow">وزارة التعليم · ${esc(b.school_name)}</span><h1>${esc(b.title)}</h1><h2>للمواد الأربع</h2><p>${esc(b.subtitle||'تحليل، خطة، متابعة، قياس أثر')}</p><div class="cover-meta"><span>اللغة العربية</span><span>اللغة الإنجليزية</span><span>الرياضيات</span><span>العلوم</span><span>${esc(b.academic_year)}</span></div></div>`;document.getElementById('nav').innerHTML=s.map((x,i)=>`<a href="#sec-${x.section_key}">${String(i+1).padStart(2,'0')} · ${esc(x.title)}</a>`).join('');document.getElementById('sideMeta').innerHTML=`<b>${esc(b.school_name)}</b><br>رمز الملف: ${esc(b.access_code)}<br>العام: ${esc(b.academic_year)}`;document.getElementById('sections').innerHTML=s.map((x,i)=>`<section id="sec-${x.section_key}" class="section glass"><div class="section-head"><div><h2>${esc(x.title)}</h2><p>${esc(x.description||'')}</p></div><div class="section-no">${String(i+1).padStart(2,'0')}</div></div><div class="blocks">${(x.blocks||[]).map(blockHtml).join('')}</div></section>`).join('');document.getElementById('updated').textContent='آخر تحديث للملف: '+new Date(b.updated_at).toLocaleString('ar-SA');document.getElementById('lookup').classList.add('hidden');document.getElementById('viewer').classList.remove('hidden')}
async function openBook(code){const err=document.getElementById('lookupError');err.classList.add('hidden');try{const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر فتح الملف');history.replaceState({},'',`achievement.html?code=${encodeURIComponent(code.toUpperCase())}`);render(d)}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}document.getElementById('lookupForm').onsubmit=e=>{e.preventDefault();openBook(document.getElementById('codeInput').value)};const q=new URLSearchParams(location.search).get('code');if(q){document.getElementById('codeInput').value=q;openBook(q)}
</script></body></html>
