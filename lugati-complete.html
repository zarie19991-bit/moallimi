/* Tamakkun worksheet studio — local teacher drafts from approved indicator bank.
   No client writes, no fabricated marks, no unapproved sharing of answer keys. */
(function(){
"use strict";
var S={role:null,profile:null,questions:[],subject:"reading",indicator:"",count:5,draft:[],answers:{},graded:false};
var names={reading:"القراءة",math:"الرياضيات",science:"العلوم",lughati:"لغتي الخالدة"};
var icons={reading:"book-open-text",math:"calculator",science:"flask-conical"};
function safe(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]})}
function icon(n){return '<i data-lucide="'+n+'" aria-hidden="true"></i>'}
function root(){return document.getElementById("tamakkunWorksheetsMount")}
function valid(q){var o=q.options;return !!(q.question_text&&Array.isArray(o)&&o.length===4&&o.every(function(x){return String(x||"").trim()})&&Number.isInteger(Number(q.correct_index))&&Number(q.correct_index)>=0&&Number(q.correct_index)<4)}
function eligible(){return S.questions.filter(function(q){return q.subject_key===S.subject&&valid(q)})}
function groups(){var map=new Map();eligible().forEach(function(q){var key=String(q.indicator_text||"").trim()||("المؤشر "+(q.indicator_index||"—"));if(!map.has(key))map.set(key,[]);map.get(key).push(q)});return map}
function filtered(){return groups().get(S.indicator)||[]}
function chips(){return '<div class="rws-steps"><span class="rws-step"><em>١</em> اختر المادة</span><span class="rws-step"><em>٢</em> راجع المؤشر</span><span class="rws-step"><em>٣</em> كوّن الورقة</span><span class="rws-step"><em>٤</em> عاين واطبع</span></div>'}
function header(){return '<section class="rws-hero"><div><span class="rws-kicker">'+icon("sparkles")+' استوديو التعلم التفاعلي</span><h1>ورقة عمل تليق بإنجاز طلابك</h1><p>اختر مؤشراً حقيقياً من بنك المادة؛ ثم ابنِ تدريباً واضحاً، وراجع الأسئلة قبل الطباعة. يُحفظ الأصل بلا تعديل، وهذه مسودة محلية وليست تكليفاً منشوراً.</p></div><div class="rws-hero-art">'+icon("notebook-pen")+'</div></section>'}
function availableSubjects(){if(S.role!=="teacher")return ["reading","math","science"];if(S.profile&&["reading","math","science"].includes(S.profile.subject_scope))return [S.profile.subject_scope];return ["reading","math","science"]}
function templateCards(){return '<div class="rws-template-grid"><article class="rws-template active"><span class="rws-template-icon">'+icon("layers-3")+'</span><strong>من بنك المؤشرات</strong><small>اختر مهارة وأضف تدريباتها</small><em>متاح للتجربة</em></article><article class="rws-template disabled"><span class="rws-template-icon">'+icon("file-scan")+'</span><strong>من اختبار خارجي</strong><small>PDF أو Word وربط الأسئلة بمؤشراتها</small><em>يحتاج ربط الاستيراد</em></article><article class="rws-template disabled"><span class="rws-template-icon">'+icon("clipboard-check")+'</span><strong>من اختبار داخل تمكّن</strong><small>إنشاء ورقة للمهارات التي أخفق فيها الطلاب</small><em>يحتاج ربط النتائج</em></article></div>'}
function control(){var gg=groups(),all=availableSubjects();return '<section class="rws-panel"><h2>مصنع أوراق العمل</h2><p>اختر طريقة إنشاء الورقة، ثم راجع المؤشر والأسئلة قبل اعتمادها.</p>'+templateCards()+chips()+
'<label for="rws-subject" class="rws-label">المادة الدراسية</label><select id="rws-subject" class="rws-select">'+all.map(function(k){return '<option value="'+k+'"'+(k===S.subject?' selected':'')+'>'+names[k]+'</option>'}).join("")+'</select>'+
'<div class="rws-label">المؤشرات المتاحة <span class="rws-chip">'+gg.size+' مؤشرات</span></div>'+
'<div class="rws-indicator-list">'+(gg.size?Array.from(gg.entries()).slice(0,100).map(function(entry,i){return '<button type="button" class="rws-indicator '+(entry[0]===S.indicator?"active":"")+'" data-rws-indicator="'+i+'"><strong>المؤشر '+(i+1)+' • '+entry[1].length+' أسئلة متاحة</strong>'+safe(entry[0])+'</button>'}).join(""):'<div class="rws-alert">لا توجد أسئلة اختيار من متعدد متاحة ومستوفية لشروط البنية من بنك '+names[S.subject]+' في هذه الجلسة. لن ننشئ أسئلة أو مؤشرات افتراضية.</div>')+'</div>'+
'<label for="rws-count" class="rws-label">عدد الأسئلة</label><select id="rws-count" class="rws-select">'+[3,5,8,10].map(function(n){return '<option value="'+n+'"'+(n===S.count?' selected':'')+'>'+n+' أسئلة</option>'}).join("")+'</select>'+
'<div class="rws-controls"><button class="rws-btn" id="rws-build" '+(filtered().length?"":"disabled")+'> '+icon("wand-sparkles")+' إنشاء ورقة المؤشر</button></div><div class="rws-alert" style="margin-top:17px">لإنشاء ورقة علاجية من اختبار تشخيصي خارجي، يلزم أولًا إدخال أسئلته وربطها بالمؤشرات ثم مراجعة المطابقة. استيراد PDF/Excel والنشر للطلاب غير مفعّلين في هذا الإصدار.</div></section>'}
function blank(){return '<div class="rws-paper"><header class="rws-paper-head"><div><span class="rws-kicker">معاينة ورقة الطالب</span><h2>استعد للتمكّن!</h2><p>تظهر ورقة العمل في هذه المساحة فور اختيار المؤشر.</p></div>'+icon("clipboard-list")+'</header><div class="rws-paper-body"><div class="rws-empty">'+icon("file-plus-2")+'<h3>اختر مؤشرًا لإنشاء ورقة عمل</h3><p>لن نعرض نشاطًا عامًا لا يرتبط بالمهارة التي تريد قياسها.</p></div></div></div>'}
function paper(){if(!S.draft.length)return blank();var evaluated=S.graded,score=S.draft.reduce(function(a,q,i){return a+(Number(S.answers[i])===Number(q.correct_index)?1:0)},0);return '<div class="rws-paper"><header class="rws-paper-head"><div><span class="rws-kicker">ورقة تفاعلية • '+safe(names[S.subject])+'</span><h2>تدريب على المؤشر</h2><p>'+safe(S.indicator)+'</p></div><div style="font-size:38px;opacity:.9">'+icon("book-open-check")+'</div></header><div class="rws-paper-body"><div class="rws-meta"><span class="rws-chip">'+icon("layers")+' '+S.draft.length+' أسئلة</span><span class="rws-chip">'+icon("shield-check")+' من بنك المؤشرات</span><span class="rws-chip">'+icon("pencil-ruler")+' معاينة محلية</span></div><div class="rws-small" style="margin:12px 0 20px">اسم الطالب: ..........................................　 الفصل: ...........　 التاريخ: ....../....../......</div>'+
S.draft.map(function(q,i){return '<article class="rws-question"><div class="rws-question-no"><b>'+(i+1)+'</b><span>السؤال '+(i+1)+' من '+S.draft.length+'</span></div>'+(q.context_text?'<p class="rws-alert" style="margin:0 0 12px">'+safe(q.context_text)+'</p>':"")+'<h3>'+safe(q.question_text)+'</h3><div class="rws-choices">'+q.options.map(function(v,j){var chosen=Number(S.answers[i])===j,clazz=chosen?"selected":"";if(evaluated&&j===Number(q.correct_index))clazz+=" correct";if(evaluated&&chosen&&j!==Number(q.correct_index))clazz+=" wrong";return '<button type="button" data-rws-answer="'+i+":"+j+'" class="rws-choice '+clazz+'" '+(evaluated?"disabled":"")+'><span class="letter">'+["أ","ب","ج","د"][j]+'</span><span>'+safe(v)+'</span></button>'}).join("")+'</div>'+(evaluated?'<div class="rws-small" style="margin-top:10px">الإجابة الصحيحة: '+["أ","ب","ج","د"][Number(q.correct_index)]+(q.explanation?" • "+safe(q.explanation):"")+'</div>':"")+'</article>'}).join("")+
(evaluated?'<div class="rws-result" role="status">'+icon("award")+' نتيجة المعاينة: '+score+' من '+S.draft.length+' <span class="rws-small">هذه نتيجة تدريب محلي فقط ولا تُحفظ في سجل الطالب.</span></div>':"")+
'<div class="rws-controls"><button type="button" class="rws-btn" id="rws-grade">'+(evaluated?"إعادة التدريب":"تصحيح المعاينة")+'</button><button type="button" class="rws-btn secondary" id="rws-print">'+icon("printer")+' طباعة A4</button><button type="button" class="rws-btn secondary" id="rws-regenerate">تغيير الأسئلة</button></div></div></div>'}
function students(){return '<section class="rws-panel"><h2>أوراق العمل التفاعلية</h2><p>ستظهر هنا أوراق العمل التي ينشرها معلم المادة بعد الربط بخدمة التكليف والحفظ.</p><div class="rws-alert" style="margin-top:20px">لا توجد في هذا القسم حاليًا أوراق منشورة مرتبطة بحسابك. يمكنك استخدام تدريبات نافس الموجودة في المنصة.</div><button type="button" class="rws-btn" id="rws-go-training" style="margin-top:18px">'+icon("graduation-cap")+' الذهاب إلى التدريبات</button></section>'}
function render(){var el=root();if(!el)return;el.innerHTML='<div class="rws">'+header()+(S.role==="teacher"?'<div class="rws-grid">'+control()+'<div>'+paper()+'</div></div>':students())+'</div>';bind(el);try{window.lucide&&window.lucide.createIcons()}catch(e){}}
function build(){var qs=filtered();if(!qs.length)return;S.draft=qs.slice(0,Math.min(S.count,qs.length));S.answers={};S.graded=false;render();var paperEl=root().querySelector(".rws-paper");if(paperEl)paperEl.scrollIntoView({behavior:"smooth",block:"start"})}
function printSheet(){if(!S.draft.length)return;var w=window.open("","_blank");if(!w){window.alert("اسمح بفتح نافذة الطباعة من المتصفح.");return}var copy=S.draft.map(function(q,i){return '<div class="task"><div class="n">السؤال '+(i+1)+'</div>'+(q.context_text?'<p class="source">'+safe(q.context_text)+'</p>':"")+'<h3>'+safe(q.question_text)+'</h3><div class="choices">'+q.options.map(function(o,j){return '<div class="option"><span>'+["أ","ب","ج","د"][j]+'</span> '+safe(o)+'</div>'}).join("")+'</div></div>'}).join("");var doc='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ورقة عمل '+safe(names[S.subject])+'</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;color:#182d27;font-size:11pt;margin:0}.head{border:2px solid #08664d;border-radius:12px;padding:15px;margin-bottom:14px}.head small{color:#08664d;font-weight:800}.head h1{font-size:20pt;margin:6px 0}.indicator{font-size:10pt;line-height:1.6}.student{padding:10px;border:1px solid #c7d6ca;border-radius:8px;margin:14px 0;font-size:10pt}.task{border:1px solid #cfdcd2;border-radius:11px;padding:13px;margin:10px 0;page-break-inside:avoid;break-inside:avoid}.n{font-size:9pt;font-weight:700;color:#08664d}.task h3{font-size:11.5pt;line-height:1.8;margin:8px 0}.source{background:#f4f7f3;padding:9px;font-size:10pt}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.option{border:1px solid #d5ddd5;border-radius:8px;padding:9px;min-height:35px}.option span{font-weight:700;color:#08664d;margin-left:9px}footer{font-size:8pt;color:#617569;margin-top:18px;border-top:1px solid #dce4dc;padding-top:7px}@media screen{body{max-width:210mm;margin:20px auto;padding:12px}}</style></head><body><header class="head"><small>مِنَصَّةُ تَمَكُّن • ورقة تدريبية</small><h1>ورقة عمل — '+safe(names[S.subject])+'</h1><div class="indicator">المؤشر: '+safe(S.indicator)+'</div></header><div class="student">اسم الطالب: .....................................................　 الفصل: ............　 التاريخ: ............</div>'+copy+'<footer>أُعدت هذه الورقة من الأسئلة المتاحة في بنك المؤشرات، ويجب على المعلم مراجعتها قبل توزيعها.</footer></body></html>';w.document.open();w.document.write(doc);w.document.close();w.focus();w.setTimeout(function(){w.print()},350)}
function bind(el){var sub=el.querySelector("#rws-subject");if(sub)sub.onchange=function(){S.subject=this.value;S.indicator=groups().keys().next().value||"";S.draft=[];S.answers={};S.graded=false;render()};var cnt=el.querySelector("#rws-count");if(cnt)cnt.onchange=function(){S.count=Number(this.value)||5};var ind=Array.from(groups().keys());el.querySelectorAll("[data-rws-indicator]").forEach(function(b){b.onclick=function(){S.indicator=ind[Number(b.dataset.rwsIndicator)];S.draft=[];render()}});var create=el.querySelector("#rws-build");if(create)create.onclick=build;el.querySelectorAll("[data-rws-answer]").forEach(function(b){b.onclick=function(){var p=b.dataset.rwsAnswer.split(":").map(Number);S.answers[p[0]]=p[1];render()}});var grade=el.querySelector("#rws-grade");if(grade)grade.onclick=function(){if(S.graded){S.answers={};S.graded=false}else if(Object.keys(S.answers).length!==S.draft.length){window.alert("أجب عن جميع الأسئلة أولًا.");return}else S.graded=true;render()};var pr=el.querySelector("#rws-print");if(pr)pr.onclick=printSheet;var gen=el.querySelector("#rws-regenerate");if(gen)gen.onclick=function(){var pool=filtered();if(pool.length>S.draft.length){pool=pool.slice(S.draft.length).concat(pool.slice(0,S.draft.length));S.draft=pool.slice(0,S.count);S.answers={};S.graded=false;render()}else build()};var train=el.querySelector("#rws-go-training");if(train)train.onclick=function(){var btn=document.querySelector('[data-nav="training"]');if(btn)btn.click();else window.alert("افتح التدريب على المؤشرات من القائمة")}}
function mount(opts){opts=opts||{};var actor=String(opts.token||"")+":"+(opts.role||"");if(S.actor!==actor){S.actor=actor;S.draft=[];S.answers={};S.graded=false;S.indicator="";S.subject="reading"}S.role=opts.role||"student";S.profile=opts.profile||{};S.questions=Array.isArray(opts.questions)?opts.questions:[];var available=availableSubjects();if(!available.includes(S.subject))S.subject=available[0];var g=groups();if(!g.has(S.indicator)){S.indicator=g.keys().next().value||"";S.draft=[]}render()}
window.TamakkunWorksheetStudio={mount:mount};
})();
</script>
