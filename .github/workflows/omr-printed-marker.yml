name: OMR printed A4 geometry replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/nafes-exam/omr-server.ts'
      - 'qa/omr/real-print-replay.ts'
      - 'qa/omr/legacy-a4.synthetic.test.ts'
      - '.github/workflows/omr-printed-marker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanned-real-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read existing anonymized physical-print reference images
        uses: actions/checkout@v4
        with:
          ref: dev/omr-production-integration
          path: omr_reference
          sparse-checkout: |
            qa/omr/results/real-six
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check server scan and grading safety integration
        run: deno check supabase/functions/nafes-exam/paper-scan.ts
      - name: Check the failed full-A4 geometry with legacy row spacing
        run: deno run --allow-read qa/omr/legacy-a4.synthetic.test.ts
      - name: Compare 360 archived visual choices to printed OMR output (no student identities)
        run: deno run --allow-read qa/omr/real-print-replay.ts
