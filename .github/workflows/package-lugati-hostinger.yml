name: Package Lugati for Hostinger

on:
  push:
    paths:
      - '.github/workflows/package-lugati-hostinger.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Hostinger package
        shell: bash
        run: |
          set -e
          mkdir -p hostinger-lugati
          cp lugati-complete.html hostinger-lugati/index.html
          cp lugati-complete.html hostinger-lugati/lugati-complete.html
          cp lugati-complete.css hostinger-lugati/
          cp lugati-complete.js hostinger-lugati/
          cp lugati-role-router.js hostinger-lugati/
          cp lugati-roster-bridge.js hostinger-lugati/
          cp lugati-student.html hostinger-lugati/
          cp lugati-student-adaptive.js hostinger-lugati/
          cp lugati-teacher-adaptive.js hostinger-lugati/
          cp lugati-indicators.js hostinger-lugati/
          printf '%s\n' \
            'منصة لغتي - حزمة Hostinger' \
            '' \
            '1) ارفع جميع محتويات هذه الحزمة داخل public_html.' \
            '2) index.html هو الصفحة الرئيسية، وهو نسخة من lugati-complete.html.' \
            '3) لا تنشئ قاعدة بيانات داخل Hostinger.' \
            '4) البيانات والمصادقة وتحليل نافس والخطط والتدريبات تبقى في Supabase.' \
            '5) صفحة الطالب: lugati-student.html' \
            '6) إذا كان public_html يحتوي صفحة افتراضية قديمة، احذفها أو استبدلها قبل رفع هذه الملفات.' \
            > hostinger-lugati/README-HOSTINGER.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lugati-hostinger-package
          path: hostinger-lugati/
          if-no-files-found: error
