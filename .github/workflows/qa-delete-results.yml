name: QA delete results
on:
  push:
    paths:
      - 'qa/delete-results-test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/delete-results-test.mjs
