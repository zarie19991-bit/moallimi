name: Deploy maintenance test audit
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/maintenance-test-audit/**'
      - '.github/workflows/deploy-maintenance-test-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase deployment token
        id: token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not configured; maintenance-test-audit deployment skipped."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.available == 'true'
        with:
          version: latest
      - name: Deploy maintenance-test-audit
        if: steps.token.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy maintenance-test-audit --project-ref udznpifopbnrcgxtpzza --no-verify-jwt
