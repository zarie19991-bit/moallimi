name: Load test 150 students

on:
  workflow_dispatch:
  push:
    paths:
      - 'load-tests/load150.mjs'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 150-student concurrent load test
        run: node load-tests/load150.mjs
