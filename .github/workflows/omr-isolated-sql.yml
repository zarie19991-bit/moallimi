name: OMR isolated PostgreSQL safety test
on:
  push:
    branches:
      - fix/omr-production-integration
  pull_request:
    paths:
      - 'qa/omr/**'
      - 'supabase/migrations/*omr_partial_publication.sql'
      - 'supabase/migrations/*omr_single_paper_publication.sql'
      - 'supabase/functions/nafes-exam/**'
      - 'review-scan*'
      - 'review-omr-safety.js'
      - '.github/workflows/omr-isolated-sql.yml'
  workflow_dispatch:
jobs:
  isolated-omr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: omr_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omr_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: omr_isolated
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated database client
        run: psql --version
      - name: Create synthetic test schema with zero live student records
        run: psql -X -v ON_ERROR_STOP=1 -f qa/omr/isolation/synthetic-schema.sql
      - name: Apply staged production-compatible SQL on synthetic database
        run: psql -X -v ON_ERROR_STOP=1 -1 -f qa/omr/production/001_omr_staged_compat.sql
      - name: Reapply migration to prove idempotence
        run: psql -X -v ON_ERROR_STOP=1 -1 -f qa/omr/production/001_omr_staged_compat.sql
      - name: Apply partial publication with unchanged per-paper validation
        run: psql -X -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261016132539_omr_partial_publication.sql
      - name: Apply bounded per-paper publication
        run: psql -X -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261016150553_omr_single_paper_publication.sql
      - name: Reapply bounded publication to verify idempotence
        run: psql -X -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261016150553_omr_single_paper_publication.sql
      - name: Test partial publication and later completion in rolled-back synthetic fixture
        run: |
          (echo 'BEGIN;'; cat qa/omr/isolation/partial-publication.sql; echo 'ROLLBACK;') | psql -X -v ON_ERROR_STOP=1
      - name: Test ACL, atomic publication, replay, review, tamper and rollback
        run: psql -X -v ON_ERROR_STOP=1 -1 -f qa/omr/isolation/smoke.sql
      - name: Check browser safety contract syntax
        run: |
          node --check review-omr-safety.js
          node --check review-scan.js
          node --check review-scan-journal.js
