name: QA full platform (seeded fixture)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require isolated QA fixture
        run: |
          echo "This full-flow harness requires its isolated QA assessment/student fixture to be seeded immediately before the run and cleaned immediately after it."
      - run: node qa/full-platform-student-flow.mjs
