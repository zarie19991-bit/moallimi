name: QA full platform
on:
  push:
    paths:
      - '.github/workflows/qa-full-platform.yml'
      - 'qa/full-platform-student-flow.mjs'
      - 'create.html'
      - 'create.js'
      - 'simulation-catalog-route.js'
      - 'teacher-access.js'
      - 'e.html'
      - 'e.js'
      - 'exam.html'
      - 'exam.js'
      - 'edge-retry.js'
      - 'supabase/functions/nafes-exam/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node qa/full-platform-student-flow.mjs
