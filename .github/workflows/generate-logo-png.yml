name: Generate complete logo PNG
on:
  push:
    branches: [main]
    paths:
      - 'moallimi-logo-complete.svg'
      - '.github/workflows/generate-logo-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render high-resolution PNG from canonical complete logo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          dwebp moallimi-logo-final.webp -o /tmp/moallimi-logo-source.png
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          src=Image.open('/tmp/moallimi-logo-source.png').convert('RGBA')
          assert src.width/src.height > 1.9, src.size
          out=src.resize((2080,1000),Image.Resampling.LANCZOS)
          out.save('moallimi-logo-complete-2x.png',optimize=True)
          chk=Image.open('moallimi-logo-complete-2x.png')
          assert chk.size == (2080,1000), chk.size
          print('PNG',chk.size,chk.mode)
          PY
      - name: Add production asset and commit
        run: |
          if ! grep -qx 'moallimi-logo-complete-2x.png' production-files.txt; then
            printf '\nmoallimi-logo-complete-2x.png\n' >> production-files.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moallimi-logo-complete-2x.png production-files.txt
          if git diff --cached --quiet; then
            echo "No logo asset changes."
          else
            git commit -m "Generate high-resolution complete logo PNG"
            git push origin HEAD:main
          fi
