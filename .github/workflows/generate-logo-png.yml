name: Generate complete logo PNG
on:
  push:
    branches: [main]
    paths:
      - 'moallimi-logo-complete.svg'
      - '.github/workflows/generate-logo-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render high-resolution PNG from complete logo
        run: |
          python -m pip install --disable-pip-version-check --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          src='moallimi-logo-complete.svg'
          out='moallimi-logo-complete-2x.png'
          cairosvg.svg2png(url=src, write_to=out, output_width=2080, output_height=1000)
          im=Image.open(out)
          assert im.size == (2080,1000), im.size
          assert im.mode in ('RGBA','LA','P','RGB'), im.mode
          print('PNG', im.size, im.mode)
          PY
      - name: Add production asset and commit
        run: |
          if ! grep -qx 'moallimi-logo-complete-2x.png' production-files.txt; then
            printf '\nmoallimi-logo-complete-2x.png\n' >> production-files.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moallimi-logo-complete-2x.png production-files.txt
          if git diff --cached --quiet; then
            echo "No logo asset changes."
          else
            git commit -m "Generate high-resolution complete logo PNG"
            git push origin HEAD:main
          fi
