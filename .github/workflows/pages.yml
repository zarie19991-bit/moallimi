name: Deploy Moallimi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build deployable site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          text = p.read_text(encoding='utf-8')

          # Never leave the whole site blank while authentication is restoring.
          text = text.replace('id="authScreen" class="auth-screen hidden"', 'id="authScreen" class="auth-screen"', 1)

          css_items = [
              '<link rel="stylesheet" href="nafes-models.css?v=20260827-1">',
              '<link rel="stylesheet" href="achievement-official.css?v=20260827-1">'
          ]
          for css in css_items:
              name = css.split('href="',1)[1].split('?',1)[0]
              if name not in text:
                  text = text.replace('</head>', css + '\n</head>', 1)

          # Keep the last stable frontend set. Timing remains enforced by the server,
          # but the recently added control layer is removed until it is re-tested.
          scripts = [
              '<script src="nafes-tests-plus.js?v=20260827-2"></script>',
              '<script src="nafes-models.js?v=20260827-1"></script>',
              '<script src="nafes-create-fix.js?v=20260827-1"></script>',
              '<script src="achievement-official.js?v=20260827-1"></script>',
              '<script src="accuracy-guard.js?v=20260827-1"></script>'
          ]
          # Remove the risky layer if it was previously injected into the source page.
          text = text.replace('<script src="assessment-controls.js?v=20260827-1"></script>\n', '')
          for script in scripts:
              name = script.split('src="',1)[1].split('?',1)[0]
              if name not in text:
                  text = text.replace('</body>', script + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
