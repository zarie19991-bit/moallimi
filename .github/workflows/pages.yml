name: Deploy NAFES workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application and reviewed-bank contract
        run: |
          for file in *.js; do node --check "$file"; done
          node --check supabase/functions/nafes-exam/index.ts
          node --test question-bank/scripts/test-reviewed-contract.mjs question-bank/scripts/test-assessments.mjs
          node question-bank/scripts/verify-reviewed-release.mjs
      - name: Verify the published reviewed tests
        run: node question-bank/scripts/verify-reviewed-release.mjs --live
      - name: Prepare public application files
        run: node question-bank/scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
