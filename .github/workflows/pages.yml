name: Deploy NAFES workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify NAFES data and JavaScript
        shell: bash
        run: |
          node --check nafes-reading.js
          node --check nafes-math.js
          node --check nafes-science.js
          node --check app.js
          node --check tests.js
          node --check exam.js
          test -f exam.html
          test -f tests.css
          test -f exam.css
          node - <<'NODE'
          global.window = {};
          require('./nafes-reading.js');
          require('./nafes-math.js');
          require('./nafes-science.js');
          const data=[window.NAFES_READING,window.NAFES_MATH,window.NAFES_SCIENCE];
          const counts=Object.fromEntries(data.map(s=>[s.key,s.outcomes.reduce((n,o)=>n+o.indicators.length,0)]));
          const outcomes=Object.fromEntries(data.map(s=>[s.key,s.outcomes.length]));
          const total=Object.values(counts).reduce((a,b)=>a+b,0);
          const testsPerIndicator=30;
          console.log({counts,outcomes,total,testModels:total*testsPerIndicator});
          if(counts.reading!==16) throw new Error('Reading indicators must equal 16');
          if(counts.math!==95) throw new Error('Math indicators must equal 95');
          if(counts.science!==159) throw new Error('Science indicators must equal 159');
          if(outcomes.reading!==3||outcomes.math!==25||outcomes.science!==48) throw new Error('Outcome counts do not match official framework');
          if(total!==270) throw new Error('Total indicators must equal 270');
          if(total*testsPerIndicator!==8100) throw new Error('Each indicator must expose at least 30 test models');
          NODE
      - name: Verify live exam engine and model 30
        shell: bash
        run: |
          RESPONSE=$(curl -fsS -X POST 'https://udznpifopbnrcgxtpzza.supabase.co/functions/v1/nafes-exam' -H 'content-type: application/json' --data '{"action":"preview","subject":"math","outcome":"1-1-1-4-9","indicator":1,"model":30}')
          echo "$RESPONSE"
          APPROVED=$(node -e "const d=JSON.parse(process.argv[1]); console.log(d.approved||0)" "$RESPONSE")
          READY=$(node -e "const d=JSON.parse(process.argv[1]); console.log(d.ready===true?'yes':'no')" "$RESPONSE")
          test "$APPROVED" -ge 24
          test "$READY" = "yes"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
