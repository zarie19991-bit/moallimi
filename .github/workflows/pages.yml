name: Deploy Moallimi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build deployable site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace('id="authScreen" class="auth-screen hidden"', 'id="authScreen" class="auth-screen"', 1)

          css_items = [
              '<link rel="stylesheet" href="nafes-models.css?v=20260827-2">',
              '<link rel="stylesheet" href="achievement-official.css?v=20260827-1">',
              '<link rel="stylesheet" href="achievement-upgrade.css?v=20260827-1">'
          ]
          for css in css_items:
              name = css.split('href="',1)[1].split('?',1)[0]
              if name not in text:
                  text = text.replace('</head>', css + '\n</head>', 1)

          scripts = [
              '<script src="nafes-tests-plus.js?v=20260827-2"></script>',
              '<script src="nafes-models.js?v=20260827-2"></script>',
              '<script src="nafes-create-fix.js?v=20260827-2"></script>',
              '<script src="achievement-official.js?v=20260827-1"></script>',
              '<script src="achievement-upgrade.js?v=20260827-1"></script>',
              '<script src="accuracy-guard.js?v=20260827-1"></script>'
          ]
          text = text.replace('<script src="assessment-controls.js?v=20260827-1"></script>\n', '')
          for script in scripts:
              name = script.split('src="',1)[1].split('?',1)[0]
              if name not in text:
                  text = text.replace('</body>', script + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')

          # Make it explicit that a second browser using the same student identity
          # resumes the same attempt; different registered students get different models.
          sp = Path('_site/student.html')
          if sp.exists():
              st = sp.read_text(encoding='utf-8')
              st = st.replace(
                  "if(session.resumed)toast('تم استكمال محاولتك السابقة والوقت مستمر من بدايتها.');",
                  "if(session.resumed)toast('تم التعرف على الطالب نفسه؛ لذلك استكملت نفس المحاولة ونفس الأسئلة. الطلاب المختلفون المسجلون يحصلون على نماذج مختلفة.');"
              )
              st = st.replace(
                  "${session.resumed?'محاولة مستكملة':'نموذج خاص بك'}",
                  "${session.resumed?'نفس الطالب — نفس المحاولة':'نموذج مختلف لهذا الطالب'}"
              )
              sp.write_text(st, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
