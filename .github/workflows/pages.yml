name: Deploy NAFES workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 270 indicators and question-bank contract
        shell: bash
        run: |
          node --check nafes-reading.js
          node --check nafes-math.js
          node --check nafes-science.js
          node --check app.js
          node --check tests.js
          node --check exam.js
          node --check create.js
          node --check simulation.js
          test -f exam.html
          test -f create.html
          test -f simulation.html
          test -f tests.css
          test -f exam.css
          test -f QUESTION_BANK.md
          test -f supabase/question-bank-schema.sql
          test -f supabase/simulation-schema.sql
          test -f supabase/functions/nafes-exam/index.ts
          test -f question-bank/scripts/build-reading-bank.mjs
          test -f question-bank/scripts/build-stem-bank.mjs
          test -f question-bank/scripts/audit-reading-bank.mjs
          test -f question-bank/scripts/audit-stem-bank.mjs
          test -f question-bank/scripts/audit-semantic-alignment.mjs
          test -f question-bank/scripts/verify-live-bank.mjs
          node question-bank/scripts/build-reading-bank.mjs
          node question-bank/scripts/audit-reading-bank.mjs
          node question-bank/scripts/build-stem-bank.mjs math
          node question-bank/scripts/audit-stem-bank.mjs math
          node question-bank/scripts/build-stem-bank.mjs science
          node question-bank/scripts/audit-stem-bank.mjs science
          node question-bank/scripts/audit-semantic-alignment.mjs
          node verify-nafes.mjs
          grep -q 'reviewed_question_bank' supabase/functions/nafes-exam/index.ts
          grep -q 'blocked_indicator_mismatch' supabase/functions/nafes-exam/index.ts
          grep -q 'generic_task' supabase/functions/nafes-exam/index.ts
          grep -q 'language_quality' supabase/functions/nafes-exam/index.ts
          grep -q 'duplicate_across_models' supabase/functions/nafes-exam/index.ts
          grep -q 'simulation_start' supabase/functions/nafes-exam/index.ts
          node --input-type=module <<'NODE'
          import {createRequire} from 'module';
          const require=createRequire(import.meta.url);
          globalThis.window={};
          require('./nafes-reading.js');
          require('./nafes-math.js');
          require('./nafes-science.js');
          const data=[window.NAFES_READING,window.NAFES_MATH,window.NAFES_SCIENCE];
          const counts=Object.fromEntries(data.map(s=>[s.key,s.outcomes.reduce((n,o)=>n+o.indicators.length,0)]));
          const outcomes=Object.fromEntries(data.map(s=>[s.key,s.outcomes.length]));
          const total=Object.values(counts).reduce((a,b)=>a+b,0);
          if(counts.reading!==16||counts.math!==95||counts.science!==159||total!==270)throw new Error('Indicator counts do not match framework');
          if(outcomes.reading!==3||outcomes.math!==25||outcomes.science!==48)throw new Error('Outcome counts do not match framework');
          const examSource=require('fs').readFileSync('exam.js','utf8');
          if(!/MODEL_COUNT=2/.test(examSource))throw new Error('Need exactly 2 tests per indicator');
          console.log({counts,outcomes,total,modelsPerIndicator:2,totalTests:total*2,questionsPerTest:15,engine:'reviewed_question_bank_only'});
          NODE
      - name: Verify live exam engine contract
        run: node question-bank/scripts/verify-live-bank.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
