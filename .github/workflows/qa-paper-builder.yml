name: QA automatic paper builder and print
on:
  push:
    branches: [main]
    paths:
      - 'review-correction.js'
      - 'review-correction.html'
      - 'review-question-papers.js'
      - 'review-question-papers.css'
      - 'review-question-papers.html'
      - 'supabase/functions/nafes-exam/**'
      - 'qa/paper-builder-regression.cjs'
      - 'qa/review-question-paper-print.mjs'
      - 'qa/review-question-paper-cross-browser.cjs'
      - 'qa/review-question-paper-webkit.mjs'
      - 'qa/review-reading-review-print.mjs'
      - 'qa/review-mixed-paper-print.mjs'
      - 'qa/review-bubble-sheet-reference.mjs'
      - '.github/workflows/qa-paper-builder.yml'
  workflow_dispatch:

jobs:
  paper-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check review-correction.js
          node --check review-question-papers.js
          node --check qa/paper-builder-regression.cjs
          node --check qa/review-question-paper-print.mjs
          node --check qa/review-question-paper-webkit.mjs
          node --check qa/review-reading-review-print.mjs
          node --check qa/review-mixed-paper-print.mjs
          node --check qa/review-bubble-sheet-reference.mjs
      - name: Builder and print regression contract
        run: node qa/paper-builder-regression.cjs
      - name: Install browser drivers
        run: |
          npm install --no-save playwright@1.55.0 selenium-webdriver@4.50.0
          npx playwright install --with-deps webkit
      - name: Start local site
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qa-paper-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/review-question-papers.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/review-question-papers.html >/dev/null
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "QA_LOCAL_SITE=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
      - name: Browser print QA
        run: node qa/review-question-paper-print.mjs
      - name: Cross-browser print QA
        run: node qa/review-question-paper-cross-browser.cjs
      - name: WebKit Safari-engine print QA
        run: node qa/review-question-paper-webkit.mjs
      - name: Reading NAFES indicators and text integrity QA
        run: node qa/review-reading-review-print.mjs
      - name: Mixed 60-question paper QA
        run: node qa/review-mixed-paper-print.mjs
      - name: Bubble-sheet reference visual QA
        run: node qa/review-bubble-sheet-reference.mjs
      - name: Upload print QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-question-paper-print
          path: qa-output/
