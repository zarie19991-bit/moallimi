name: QA load 140 (seeded fixture)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require isolated QA fixture
        run: |
          echo "This load harness requires the isolated QALOAD22 fixture to be seeded immediately before the run and cleaned immediately after it."
      - run: node qa/load-140.mjs
