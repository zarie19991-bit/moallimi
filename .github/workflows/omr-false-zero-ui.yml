name: OMR false-zero UI hotfix regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'review-scan-journal.js'
      - 'supabase/functions/nafes-exam/paper-scan.ts'
      - 'supabase/functions/nafes-exam/omr-multiple-review.ts'
      - 'supabase/functions/nafes-exam/omr-identity-fix.ts'
      - 'supabase/functions/nafes-exam/omr-multiple-evidence.ts'
      - 'supabase/functions/nafes-exam/omr-server.ts'
      - 'qa/omr/identity-diagnostic-remediation.test.mjs'
      - 'qa/omr/qr-recovery-without-rescan.test.mjs'
      - 'review-scan.js'
      - 'supabase/functions/nafes-exam/paper-scan.ts'
      - 'qa/omr/multiple-adjudication.test.mjs'
      - 'review-scan.css'
      - 'review-scan.html'
      - 'review-omr-safety.js'
      - 'qa/omr/independent-sheet-review.test.mjs'
      - 'supabase/migrations/20261010083000_omr_independent_sheet_review.sql'
      - 'qa/omr/hotfix-false-zero-ui.test.mjs'
      - 'qa/omr/blank-bubble-consensus.test.mjs'
      - 'supabase/functions/nafes-exam/omr-server.ts'
      - 'supabase/functions/nafes-exam/omr-blank.ts'
      - 'supabase/functions/nafes-exam/omr-center-evidence.ts'
      - 'qa/omr/center-evidence-diagnostics.test.mjs'
      - '.github/workflows/omr-false-zero-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  false-zero-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JS syntax
        run: node --check review-scan-journal.js
      - name: Require real-zero vs failed-scan states
        run: node qa/omr/hotfix-false-zero-ui.test.mjs
      - name: Prove empty bubbles produce zero and no invented selections
        run: node --test qa/omr/blank-bubble-consensus.test.mjs
      - name: Validate center evidence and truthful diagnostic units
        run: node --test qa/omr/center-evidence-diagnostics.test.mjs
      - name: Verify independent per-sheet OMR approval without unlocking uncertain answers
        run: node --test qa/omr/independent-sheet-review.test.mjs
      - name: Check teacher choices for multiple shading and audit
        run: node --test qa/omr/multiple-adjudication.test.mjs
      - name: Check that corrected identity does not falsely invalidate all OMR answers
        run: node --test qa/omr/identity-diagnostic-remediation.test.mjs
      - name: Verify local QR retry and identity link without forced rescan
        run: node --test qa/omr/qr-recovery-without-rescan.test.mjs
