name: Fetch verified Lugati 1448 books once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-lugati-1448.yml

permissions:
  contents: write

jobs:
  fetch-books-once:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify the three exact 1448 PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p books

          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://tgvideodownloader.org/api/api/download?url=https%3A%2F%2Ft.me%2FArArbbic%2F5082" \
            -o "books/lugati-1m-1448-f1.pdf" &
          p1=$!
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://tgvideodownloader.org/api/api/download?url=https%3A%2F%2Ft.me%2FArArbbic%2F5084" \
            -o "books/lugati-2m-1448-f1.pdf" &
          p2=$!
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://tgvideodownloader.org/api/api/download?url=https%3A%2F%2Ft.me%2FArArbbic%2F5086" \
            -o "books/lugati-3m-1448-f1.pdf" &
          p3=$!
          wait "$p1"
          wait "$p2"
          wait "$p3"

          cat > /tmp/lugati-sha256.txt <<'SUMS'
          917f01c49de09442d663b7304c4c1586109837abb44dfcaa53d563ce33cb79c6  books/lugati-1m-1448-f1.pdf
          d799edb12a49d456053ef21e055296a388ea4fb891fe4bcd77a46a626332b3f3  books/lugati-2m-1448-f1.pdf
          dac51971415e2da2ce651de8f6e4a3ebd68c35653ce904153ef83577965b7e12  books/lugati-3m-1448-f1.pdf
          SUMS
          sha256sum -c /tmp/lugati-sha256.txt
          for pdf in books/*.pdf; do
            test "$(head -c 5 "$pdf")" = "%PDF-"
          done

          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -f 1 -singlefile -jpeg -jpegopt quality=86 -r 75 \
            books/lugati-1m-1448-f1.pdf books/lugati-1m-1448-cover
          pdftoppm -f 1 -singlefile -jpeg -jpegopt quality=86 -r 75 \
            books/lugati-2m-1448-f1.pdf books/lugati-2m-1448-cover
          pdftoppm -f 1 -singlefile -jpeg -jpegopt quality=86 -r 75 \
            books/lugati-3m-1448-f1.pdf books/lugati-3m-1448-cover
          ls -lh books/*

      - name: Publish books and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/*.pdf books/*cover.jpg
          git rm .github/workflows/fetch-lugati-1448.yml
          git commit -m "Add verified Lugati 1448 semester-one books"
          git push
