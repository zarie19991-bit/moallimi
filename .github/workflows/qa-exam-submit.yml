name: QA exam submission priority
on:
  push:
    branches: [fix/exam-submit-priority]
  pull_request:
    paths:
      - 'e-player-demo-fix.js'
      - 'e.html'
      - 'e.css'
      - 'qa/exam-submit-priority.cjs'
      - 'qa/exam-submit-queue.test.cjs'
      - '.github/workflows/qa-exam-submit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check e-player-demo-fix.js
      - run: node --test qa/exam-submit-queue.test.cjs
      - run: node --test question-bank/scripts/test-delivery-reliability-contract.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node qa/exam-submit-priority.cjs
