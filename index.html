<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معلّمي</title>
<meta name="theme-color" content="#0f514c">
<style>
:root{--bg:#f4f5f2;--paper:#fffdf8;--ink:#17324d;--teal:#0f514c;--gold:#c6a04a;--muted:#6f7d84;--line:#dedbd1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 85% 0,#e5efec 0,transparent 34%),var(--bg);color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(780px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:54px 34px;text-align:center;box-shadow:0 24px 70px rgba(23,50,77,.10)}
.mark{width:78px;height:78px;border-radius:24px;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,var(--teal),#173d46);color:#fff;font-size:31px;font-weight:900;box-shadow:0 12px 28px rgba(15,81,76,.18)}
h1{font-size:38px;margin:20px 0 8px}p{margin:0 auto;max-width:580px;line-height:2;color:var(--muted);font-size:15px}.rule{width:110px;height:3px;background:var(--gold);margin:24px auto}.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:9px 14px;border-radius:999px;background:#edf4f2;color:var(--teal);font-weight:800;font-size:12px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
</style>
</head>
<body>
<main>
  <section class="shell" aria-label="معلّمي">
    <div class="mark">م</div>
    <h1>معلّمي</h1>
    <div class="rule"></div>
    <p>تم حذف جميع الأقسام والواجهات السابقة من المنصة. هذه صفحة نظيفة فقط، وسيتم بناء التجربة الجديدة من الصفر بشكل مترابط وتفاعلي بدل الأقسام المنفصلة القديمة.</p>
    <div class="status">واجهة نظيفة بدون أقسام</div>
  </section>
</main>
</body>
</html>
