<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقل إلى مركز إنشاء الاختبارات | معلّمي</title>
<meta name="robots" content="noindex">
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f6faf9;color:#17324d;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;border:1px solid #dce7ea;border-radius:18px;padding:28px;max-width:560px;text-align:center;box-shadow:0 12px 35px rgba(20,70,60,.08)}a{color:#0f514c;font-weight:900}</style>
</head>
<body>
<div class="box"><h1>تم دمج الاختبارات المحاكية مع إنشاء الاختبارات</h1><p>أصبح لديك مركز واحد لإنشاء جميع أنواع اختبارات نافس.</p><p><a id="go" href="create.html?mode=simulation">فتح مركز إنشاء الاختبارات</a></p></div>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 if(p.has('t')){location.replace('e.html?t='+encodeURIComponent(p.get('t')));return;}
 if(p.has('c')){location.replace('e.html?c='+encodeURIComponent(p.get('c')));return;}
 const target='create.html?mode=simulation';
 document.getElementById('go').href=target;
 location.replace(target);
})();
</script>
</body>
</html>
