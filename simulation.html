<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f514c"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>محاكاة نافس | معلّمي</title><link rel="stylesheet" href="simulation.css?v=20260903-1"></head>
<body>
<header class="sim-top"><a href="./" class="brand"><span>م</span><div><b>معلّمي</b><small>محاكاة نافس الكاملة</small></div></a><div id="simCode" class="sim-code"></div></header>
<main class="sim-shell">
 <section id="intro" class="panel intro"><span class="kicker">الصف الثالث المتوسط</span><h1 id="title">تحميل المحاكاة...</h1><p id="details"></p><div id="sectionSummary" class="section-summary"></div><div id="readiness" class="readiness"></div>
  <form id="studentForm" class="student-form hidden"><label id="studentNameWrap"><span>اسم الطالب الكامل</span><input id="studentName" autocomplete="name" required placeholder="اكتب الاسم كما هو في الكشف"></label><label id="studentListWrap" class="hidden"><span>اسم الطالب</span><select id="studentList"></select></label><label><span id="studentNoLabel">رقم الطالب / رقم مميز</span><input id="studentNo" required placeholder="مثال: 12"></label><button type="submit">ابدأ المحاكاة</button></form>
 </section>
 <section id="exam" class="panel exam hidden"><div class="exam-head"><div><small id="sectionMeta"></small><h2 id="sectionTitle"></h2></div><div class="head-actions"><button id="calculatorBtn" class="calculator-btn hidden" type="button">آلة حاسبة</button><div id="timer" class="timer">--:--</div></div></div><div id="sectionTabs" class="section-tabs"></div><div id="progress" class="progress"></div><article id="question" class="question"></article><div class="exam-nav"><button id="prev" type="button">السابق</button><button id="review" type="button">مراجعة القسم</button><button id="next" type="button">التالي</button></div></section>
 <section id="breakPanel" class="panel break-panel hidden"><span>استراحة بين الأقسام</span><h2 id="breakTitle"></h2><div id="breakTimer" class="break-timer"></div><button id="skipBreak" type="button">بدء القسم التالي الآن</button></section>
 <section id="result" class="panel result hidden"></section>
</main>
<div id="calculator" class="modal hidden"><div class="calc-card"><button id="closeCalculator" type="button" aria-label="إغلاق">×</button><h3>آلة حاسبة</h3><div class="calc-line"><input id="calcA" inputmode="decimal" placeholder="العدد الأول"><select id="calcOp"><option>+</option><option>−</option><option>×</option><option>÷</option></select><input id="calcB" inputmode="decimal" placeholder="العدد الثاني"></div><button id="calculate" type="button">احسب</button><output id="calcResult">—</output></div></div>
<script src="simulation.js?v=20260903-1"></script>
</body></html>
