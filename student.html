<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الطالب | معلّمي</title><meta name="theme-color" content="#0f514c">
<link rel="stylesheet" href="app.css?v=20260827-1">
</head>
<body>
<main class="portal">
  <div class="portal-wrap">
    <header class="portal-head"><div class="brand-mark">م</div><h1>بوابة الطالب</h1><p>التسليم والاختبارات من نفس المكان.</p></header>
    <section class="card">
      <div class="portal-tabs"><button id="taskTab" class="active">رفع واجب / مشروع</button><button id="testTab">اختبار</button></div>
      <div id="taskPane">
        <form id="taskForm">
          <div class="field"><label>كود الواجب أو المشروع</label><input id="taskCode" name="code" required style="text-transform:uppercase" placeholder="اكتب الكود"></div>
          <div class="field"><label>اسم الطالب كاملًا كما هو في كشف المدرسة</label><input name="student_name" required></div>
          <div class="field"><label>رقم الطالب (إن وجد)</label><input name="student_number"></div>
          <div class="field"><label>الملف</label><input name="file" type="file" required accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.webp"></div>
          <button id="taskSubmit" class="btn primary wide">تسليم الملف</button>
        </form>
        <div id="taskResult" style="margin-top:12px"></div>
      </div>
      <div id="testPane" class="hidden">
        <div id="testLookup">
          <form id="testPreviewForm">
            <div class="field"><label>كود الاختبار</label><input id="testCode" name="code" required style="text-transform:uppercase" placeholder="اكتب كود الاختبار"></div>
            <button class="btn primary wide">فتح الاختبار</button>
          </form>
        </div>
        <div id="testArea"></div>
      </div>
    </section>
  </div>
</main>
<div id="toast" class="toast hidden"></div>
<script>
const SB_URL='https://udznpifopbnrcgxtpzza.supabase.co';
const SB_KEY='sb_publishable_UIuOZaeLk3oz25yf1kd-PA_OF8vEu8N';
const SUBMIT=SB_URL+'/functions/v1/student-submit',TEST=SB_URL+'/functions/v1/achievement-student';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let session=null,preview=null;
function toast(m,b=false){const t=$('toast');t.textContent=m;t.className='toast'+(b?' bad':'');t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function tab(name){$('taskTab').classList.toggle('active',name==='task');$('testTab').classList.toggle('active',name==='test');$('taskPane').classList.toggle('hidden',name!=='task');$('testPane').classList.toggle('hidden',name!=='test')}
$('taskTab').onclick=()=>tab('task');$('testTab').onclick=()=>tab('test');
const q=new URLSearchParams(location.search);if(q.get('task')){$('taskCode').value=q.get('task');tab('task')}if(q.get('test')){$('testCode').value=q.get('test');tab('test');setTimeout(()=>$('testPreviewForm').requestSubmit(),50)}
$('taskForm').onsubmit=async e=>{e.preventDefault();const b=$('taskSubmit');b.disabled=true;b.textContent='جارٍ رفع الملف...';try{const fd=new FormData(e.target);fd.set('code',String(fd.get('code')).trim().toUpperCase());const r=await fetch(SUBMIT,{method:'POST',headers:{apikey:SB_KEY},body:fd});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'تعذر التسليم');$('taskResult').innerHTML=`<div class="result-hero"><strong>✓</strong><span>${esc(d.message)}</span><h3>${esc(d.assignment_title)}</h3><p>${esc(d.student_name)}${d.is_late?' · تم تسجيله كتسليم متأخر':''}</p></div>`;e.target.reset()}catch(err){toast(err.message,true)}finally{b.disabled=false;b.textContent='تسليم الملف'}};
async function testCall(body){const r=await fetch(TEST,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر فتح الاختبار');return d}
$('testPreviewForm').onsubmit=async e=>{e.preventDefault();const code=$('testCode').value.trim().toUpperCase();try{preview=await testCall({action:'preview',code});$('testArea').innerHTML=`<div class="soft-card" style="margin-top:12px"><span class="status high">${esc(preview.subject_name)}</span><h2 style="margin:10px 0 5px">${esc(preview.title)}</h2><p style="color:#71808a;line-height:1.8">${esc(preview.grade_level)} · ${preview.question_count} أسئلة · ${preview.duration_min} دقيقة</p><form id="startTestForm"><div class="field"><label>اسم الطالب كاملًا كما هو في كشف المدرسة</label><input name="student_name" required></div><button class="btn primary wide">ابدأ الاختبار</button></form></div>`;$('startTestForm').onsubmit=startTest}catch(err){toast(err.message,true)}};
async function startTest(e){e.preventDefault();const name=new FormData(e.target).get('student_name');try{session=await testCall({action:'start',code:preview.code,student_name:name});renderQuestions()}catch(err){toast(err.message,true)}}
function renderQuestions(){const qs=session.questions||[];$('testLookup').classList.add('hidden');$('testArea').innerHTML=`<div class="soft-card" style="margin-bottom:12px"><b>${esc(session.student_name)}</b><div style="color:#71808a;font-size:11px;margin-top:4px">${esc(session.title)} · النموذج مخصص لهذه المحاولة</div></div><form id="answerForm">${qs.map((q,i)=>`<section class="question"><h4>${i+1}) ${esc(q.prompt).replace(/\n/g,'<br>')}</h4>${(q.options||[]).map((o,j)=>`<label class="option"><input type="radio" name="q-${q.id}" value="${j+1}" required><span>${esc(o)}</span></label>`).join('')}</section>`).join('')}<button class="btn primary wide">تسليم الاختبار</button></form>`;$('answerForm').onsubmit=finishTest}
async function finishTest(e){e.preventDefault();const fd=new FormData(e.target),answers=(session.questions||[]).map(q=>({question_id:q.id,selected:+fd.get('q-'+q.id)}));const b=e.target.querySelector('button');b.disabled=true;b.textContent='جارٍ التصحيح...';try{const r=await testCall({action:'finish',attempt_id:session.attempt_id,attempt_token:session.attempt_token,answers});renderResult(r)}catch(err){toast(err.message,true);b.disabled=false;b.textContent='تسليم الاختبار'}}
function renderResult(r){$('testArea').innerHTML=`<div class="result-hero"><strong>${Math.round(r.percent)}٪</strong><span>${r.counts_toward_achievement?'تم تسجيل النتيجة في ملفك والتحصيل':'هذا تدريب ولا يدخل في درجة التحصيل'}</span><h3>المرحلة التالية: ${esc(r.next_stage)}</h3>${r.rank?`<p>الترتيب الحالي: ${r.rank} من ${r.participants}</p>`:''}</div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">المهارات التي تحتاج مراجعة</h3>${(r.weak_objectives||[]).length?(r.weak_objectives||[]).map(x=>`<div class="soft-card" style="margin-top:7px"><b>${esc(x.title)}</b><span style="float:left">${Math.round(x.percent)}٪</span></div>`).join(''):'<span class="status high">لا توجد أهداف أقل من 60٪ في هذا الاختبار</span>'}</div><button class="btn wide" style="margin-top:12px" onclick="location.reload()">العودة للبوابة</button>`}
</script>
</body></html>
