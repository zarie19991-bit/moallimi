<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>اختبار نافس | معلّمي</title><link rel="stylesheet" href="e.css?v=20260907-2"></head><body>
<header class="exam-top"><a class="brand" href="./"><span>م</span><div><b>معلّمي</b><small>اختبارات نافس</small></div></a><span id="code"></span><span id="saveState" role="status"></span></header><main id="screen" class="exam-shell">
<section id="intro" class="panel intro-panel"><span class="kicker">نافس · الثالث المتوسط</span><h1 id="title">جارٍ تحميل الاختبار…</h1><p id="details"></p><div id="sections"></div><p id="message" role="alert"></p><form id="identity" hidden><label>اسم الطالب الكامل<input id="studentName" required autocomplete="name" maxlength="120" placeholder="كما هو في كشف الفصل"></label><label id="numberLabel">رقم الطالب المميز<input id="studentNo" required maxlength="160" autocomplete="off"></label><label>الفصل<input id="className" maxlength="80" placeholder="إن لم يكن محددًا في الاختبار"></label><button type="submit">ابدأ الاختبار</button></form></section>
<section id="player" class="panel exam-panel" hidden><div class="exam-head"><div><small id="sectionTitle"></small><h2 id="questionTitle"></h2></div><b class="timer" id="timer" aria-label="الوقت المتبقي"></b></div><div class="progress" id="progress"></div><div id="questions"></div><div class="nav exam-nav"><button id="prev">السابق</button><button id="review">مراجعة الإجابات</button><button id="next">التالي</button><button id="finish">تسليم القسم</button></div><button id="calcButton" hidden>آلة حاسبة</button><p id="playerError" role="alert"></p></section>
<section id="breakPanel" class="panel" hidden><h2>استراحة بين الأقسام</h2><p id="breakText"></p></section><section id="result" class="panel" hidden></section>
<dialog id="calculator"><h2>آلة حاسبة</h2><input id="calcA" type="number" step="any" aria-label="العدد الأول"><select id="calcOp" aria-label="العملية"><option>+</option><option>−</option><option>×</option><option>÷</option></select><input id="calcB" type="number" step="any" aria-label="العدد الثاني"><button id="calcGo">احسب</button><output id="calcResult"></output><button id="calcClose">إغلاق</button></dialog></main>
<div id="watermark" aria-hidden="true"></div><div id="printShield">الطباعة غير متاحة أثناء الاختبار.</div><script src="question-media.js?v=review-v4"></script><script src="e.js?v=20260907-2"></script></body></html>
